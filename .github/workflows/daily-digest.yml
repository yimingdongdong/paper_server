name: Daily AI Bio Digest

on:
  schedule:
    # UTC 01:00 = Beijing 09:00 (GitHub Actions uses UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          # 新配置：qmsg / serverchan / wecom / pushplus / none
          PUSH_TYPE: ${{ secrets.PUSH_TYPE }}
          # 兼容旧的 WECHAT_PUSH_TYPE（可选）
          WECHAT_PUSH_TYPE: ${{ secrets.WECHAT_PUSH_TYPE }}
          # QQ Qmsg酱
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          QMSG_QQ: ${{ secrets.QMSG_QQ }}
          # Server酱
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          # 企业微信机器人
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          # PushPlus
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_FILE: state.json
        run: python app.py

      - name: Commit seen-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged"
          else
            git commit -m "chore: update daily digest seen state [skip ci]"
            git push
          fi
