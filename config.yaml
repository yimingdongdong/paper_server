exclude_keywords:
  - "medical image"
  - "medical imaging"
  - "mri"
  - "ct scan"
  - "chest radiograph"
  - "wearable"
  - "clinical"
  - "diagnosis"
  - "patient"
  - "electronic health record"
  - "ehr"
  - "hospital"
  - "healthcare"
  - "alzheimer"
  - "cardiovascular"
  - "federated learning"

# 重点关注的研究者：这些人一有论文/预印本，必须出现在日报里
followed_authors:
  # 在这里填你想关注的人名，例如：
  # - "Demis Hassabis"
  # - "John Jumper"
  # - "Marinka Zitnik"
  # - "Max Welling"
  - ""

# 是否过滤掉“纯实验类”论文（没有 AI/计算/设计方法的内容）
exclude_experimental: true

# 实验类论文的典型信号词，可自行增删
experimental_terms:
  - "clinical trial"
  - "in vivo"
  - "in vitro"
  - "mouse model"
  - "patient"
  - "cell line"
  - "breast cancer"
  - "cell cycle"
  - "proteome"
  - "tumor"
  - "cancer"
  - "knockout"
  - "cryo-em"
  - "x-ray crystallography"

# After keyword filtering, max number of candidates sent to DeepSeek
max_items_before_llm: 80
# Max number kept in final digest
max_items_final: 15

# Only fetch items from last N days
lookback_days: 7

# Whether to enable first-pass keyword filtering
use_rule_filter: true

# Title prefix
digest_name: "AI x Bio 每日情报"

# Sources
sources:
  - name: "arXiv"
    type: arxiv
    query: 'cat:q-bio.BM OR cat:q-bio.QM OR cat:q-bio.GN OR cat:q-bio.SC OR cat:q-bio.CB OR cat:q-bio.MN OR cat:cs.LG OR cat:cs.AI OR cat:cs.CL OR cat:cs.NE'
    max_results: 200

  - name: "Nature Machine Intelligence"
    type: rss
    url: "https://www.nature.com/natmachintell.rss"

  - name: "Nature Computational Science"
    type: rss
    url: "https://www.nature.com/natcomputsci.rss"

  - name: "Nature"
    type: rss
    url: "https://www.nature.com/nature.rss"

  - name: "Science"
    type: rss
    url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science"

  - name: "Cell"
    type: rss
    url: "https://www.cell.com/cell/current.rss"

# DeepSeek prompt config
llm:
  enabled: true
  model: "deepseek-chat"
  max_tokens: 2000
  temperature: 0.2
  system_prompt: |
    你是一位科研情报助手，服务于一位研究方向明确的学者。
    他的核心关注点是：多肽、蛋白质、抗体、小分子、药物设计、虚拟细胞，以及 flow matching / diffusion 等生成模型技术迭代。
    此外，泛泛的 LLM 行为研究、LLM 训练技巧、Agent 框架、world model、JEPA 也都可以推送，不要因为这些不是生物方向就排除。
    你的任务是保留真正有信息量的 AI/计算方法论文，同时避免医学影像、临床诊断、可穿戴、纯实验论文等无关内容。
  user_prompt: |
    请从下面的候选列表中筛选与以下方向相关的论文/资讯：
    1. 多肽 / 蛋白质 / 抗体 / 小分子 / 药物设计 / 虚拟筛选 / 分子生成
    2. 虚拟细胞、单细胞扰动预测、细胞状态建模、基因表达预测
    3. 蛋白质语言模型、蛋白质结构预测、binding affinity、docking、ADMET
    4. flow matching、diffusion model、score-based、normalizing flow、rectified flow 等技术迭代
    5. 上述方向中使用的几何深度学习、图神经网络、等变网络、生成模型、表示学习
    6. LLM 行为研究、LLM 训练/后训练技巧、Agent / 多智能体框架、world model、JEPA、reasoning model

    明确排除：
    - 医学影像、MRI、CT、胸片、病理图像
    - 临床诊断、患者数据、可穿戴设备、健康管理、EHR
    - 纯实验生物学/医学论文，没有 AI/计算方法的内容
    - 与上述方向完全无关的其他 AI 应用

    规则：
    1. 宁缺毋滥，不要为了凑数而保留不相关条目。
    2. 如果候选里有多条相关，请尽量全部列出；最多保留 {max_items_final} 条。
    3. 按重要度排序：药物设计/分子生成 > flow matching/diffusion > 蛋白/多肽/抗体/虚拟细胞 > LLM/Agent/world model/JEPA > 其他。
    4. 输出 Markdown 格式，不要输出额外解释，格式为：
       ## 今日重点
       ### 1. [来源] 标题
       **一句话点评**：...
       原文：URL
    5. 如果确实没有相关内容，只输出“今日没有特别值得关注的新内容。”

    候选列表：
    {items}
