# ===== Daily research intelligence config =====

# Your research interests (used for first-pass keyword filtering)
keywords:
  - "ai for biology"
  - "ai for science"
  - "artificial intelligence for biology"
  - "biology"
  - "peptide"
  - "peptide design"
  - "protein"
  - "protein design"
  - "protein language model"
  - "large language model"
  - "large language models"
  - "llm"
  - "language model"
  - "foundation model"
  - "generative model"
  - "generative ai"
  - "antibody"
  - "antibody design"
  - "de novo protein"
  - "drug discovery"

# After keyword filtering, max number of candidates sent to DeepSeek
max_items_before_llm: 40
# Max number kept in final digest
max_items_final: 12

# Only fetch items from last N days
lookback_days: 3

# Whether to enable first-pass keyword filtering
use_rule_filter: true

# Title prefix
digest_name: "AI x Bio 每日情报"

# Sources
sources:
  - name: "arXiv"
    type: arxiv
    query: 'cat:q-bio.BM OR cat:q-bio.QM OR cat:q-bio.GN OR cat:q-bio.SC OR cat:cs.LG OR cat:cs.AI OR cat:cs.CL OR cat:cs.NE'
    max_results: 100

  - name: "Nature Machine Intelligence"
    type: rss
    url: "https://www.nature.com/natmachintell.rss"

  - name: "Nature Computational Science"
    type: rss
    url: "https://www.nature.com/natcomputsci.rss"

  - name: "Nature"
    type: rss
    url: "https://www.nature.com/nature.rss"

  - name: "Science"
    type: rss
    url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science"

  - name: "Cell"
    type: rss
    url: "https://www.cell.com/cell/current.rss"

# DeepSeek prompt config
llm:
  enabled: true
  model: "deepseek-chat"
  max_tokens: 2000
  temperature: 0.2
  system_prompt: |
    你是一位严谨的科研情报助手，服务于一位从事“AI for Biology / 蛋白质 / 多肽 / 大语言模型 / 生成模型 / 抗体设计 / 药物发现”研究的学者。
    你的任务是从候选论文与资讯中筛选出真正重要且相关的内容，并用中文给出简洁、专业、不夸大的点评。
  user_prompt: |
    请从下面的候选列表中筛选与“AI for biology、蛋白质/多肽设计、蛋白质语言模型、大语言模型、生成模型、抗体设计、药物发现”相关的内容。
    规则：
    1. 只剔除明显无关的内容；只要与上述领域沾边就尽量保留，宁多勿缺。
    2. 如果候选列表里有多条相关，请全部列出；最多保留 {max_items_final} 条，并按重要度排序。
    3. 输出 Markdown 格式，不要输出额外解释，格式为：
       ## 今日重点
       ### 1. [来源] 标题
       **一句话点评**：...
       原文：URL
    4. 如果没有值得推荐的条目，只输出“今日没有特别值得关注的新内容。”

    候选列表：
    {items}
